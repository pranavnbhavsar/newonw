<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MrPerfectV5 - Live Predictions UI</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 20px; background:#0f172a; color:#e6eef8; }
    .card { background:#0b1220; border-radius:12px; padding:16px; box-shadow: 0 6px 18px rgba(2,6,23,0.6); max-width:1200px; margin:auto; }
    pre { white-space:pre-wrap; word-break:break-word; max-height:60vh; overflow:auto; padding:12px; background:#071024; border-radius:8px; }
    header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    h1 { font-size:20px; margin:0; }
    .meta { color:#9fb3d6; font-size:13px; }
    .controls { margin-top:10px; display:flex; gap:8px; align-items:center; }
    button { background:#123; border:1px solid #224; color:#dbe9ff; padding:8px 12px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div>
        <h1>MrPerfectV5 — Live Prediction Output</h1>
        <div class="meta">Shows the same stdout output that fetcher.py prints — updated live (polls every 1.5s).</div>
      </div>
    </header>

    <div class="controls">
      <button id="refresh">Refresh now</button>
      <button id="downloadLog">Download log</button>
      <div style="flex:1"></div>
      <div class="meta">Tip: start the bridge script <code>python ui/fetcher_ui_bridge.py</code> from your project root to populate the log.</div>
    </div>

    <pre id="logArea">Loading...</pre>
  </div>

  <script>
    async function fetchLog(){
      try{
        let res = await fetch('/api/log');
        if(!res.ok) throw new Error('Fetch failed');
        let lines = await res.json();
        document.getElementById('logArea').textContent = lines.join('\n');
      }catch(e){
        document.getElementById('logArea').textContent = 'Could not fetch log: ' + e;
      }
    }
    document.getElementById('refresh').addEventListener('click', fetchLog);
    document.getElementById('downloadLog').addEventListener('click', ()=>{
      window.location = '/download/ui/predictions.log';
    });
    setInterval(fetchLog, 1500);
    fetchLog();
  </script>
</body>
</html>
